split:
  final_test_ratio: 0.15
  method: expanding
  n_folds: 4
  val_ratio_within_dev: 0.1
labeling:
  horizon: 5
  threshold_method: quantile
  threshold_quantile: 0.4
  threshold_quantile_candidates:
  - 0.2
  - 0.3
  - 0.4
  - 0.5
  neutral_policy: drop
  bull_label: 1
  bear_label: 0
  neutral_label: -1
sequence:
  lookback: 21
  lookback_candidates:
  - 5
  - 10
  - 21
  - 42
  flatten_for_tabular: true
preprocessing:
  missing_policy: ffill_then_drop_head
  scalers:
  - standard
  - robust
decision:
  probability_threshold: 0.5
  threshold_search:
    enabled: true
    metric: mcc
    start: 0.05
    stop: 0.95
    step: 0.01
training:
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10
  learning_rate: 0.001
  learning_rate_candidates:
  - 0.0001
  - 0.0003
  - 0.001
  shuffle_train: true
  monitor_metric: mcc
evaluation:
  primary_metric: mcc
  secondary_metrics:
  - f1
  - balanced_accuracy
models:
  enabled:
  - logreg
  - random_forest
  - xgboost
  - lightgbm
  - catboost
  - gru
  - cnn1d
logreg:
  class_weight: balanced
  max_iter: 2000
  solver: lbfgs
random_forest:
  n_estimators: 500
  min_samples_leaf: 5
  max_features: sqrt
  class_weight: balanced
xgboost:
  n_estimators: 400
  max_depth: 3
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: logloss
lightgbm:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  class_weight: balanced
catboost:
  iterations: 400
  depth: 4
  learning_rate: 0.03
  eval_metric: MCC
  auto_class_weights: Balanced
  allow_writing_files: false
gru:
  hidden_dim: 64
  num_layers: 1
  dropout: 0.2
  weighted_loss: true
cnn1d:
  conv_channels: 64
  kernel_size: 3
  dropout: 0.2
  weighted_loss: true
artifacts:
  root_dir: artifacts
  save_fold_reports: true
  save_test_predictions: true
  save_model_checkpoints: true
